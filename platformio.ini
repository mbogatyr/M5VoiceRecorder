; M5VoiceRecorder — voice recorder on M5StickS3 (ESP32-S3-PICO-1-N8R8)

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The StickS3 carries 8 MB of flash and 8 MB of octal PSRAM.
; partitions.csv: a 2 MB app and ~5.9 MB of LittleFS for recordings.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

; The framework appends its own -std=gnu++11 after build_flags, and the last
; one wins: without this unflag the board builds as C++11, not C++17
build_unflags = -std=gnu++11
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17

lib_deps = m5stack/M5Unified

; `pio run -e sticks3 -t merged` builds a single image for M5Burner
extra_scripts = post:tools/merged_image.py

monitor_speed = 115200

; Everything in lib/ is hardware-independent and is tested on the host
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
